---
- name: create .zshrc.d to store profile hooks
  file:
    dest: ~/.zshrc.d
    state: directory
    mode: 0755

- name: copy .zshrc
  copy: src=.zshrc dest=~/.zshrc

- name: install iterm2
  shell: brew install iterm2 --cask
  args:
    creates: /Applications/iTerm.app

- name: install jq
  homebrew: name=jq state=latest
